spring:
  application:
    name: brick-reviews-api

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5435/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate      
    open-in-view: false       

  flyway:
    enabled: true

  session:
    jdbc:
      initialize-schema: always   

management:
  endpoints:
    web:
      base-path: /api 
      exposure:
        include: health       